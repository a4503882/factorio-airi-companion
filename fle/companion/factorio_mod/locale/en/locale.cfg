[mod-setting-description]
airi-companion-bridge-port=Localhost UDP port where the AIRI AgentBridge listens.
airi-companion-session-token=Optional shared token used to reject unrelated local UDP packets. Keep blank to disable token checking.
airi-companion-auto-spawn=Create AIRI near the first available player when the save loads.
airi-companion-display-name=Name shown above the companion and on her force-visible map marker.
airi-companion-respawn-seconds=How long AIRI waits before respawning after death.
airi-companion-perception-radius=Maximum radius exposed by structured observation tools.
airi-companion-follow-distance=Distance AIRI tries to keep from her owner.

