[mod-setting-name]
airi-companion-bridge-port=AIRI 本地桥 UDP 端口
airi-companion-session-token=AIRI 桥会话令牌
airi-companion-auto-spawn=自动召唤 AIRI
airi-companion-display-name=陪玩角色显示名称
airi-companion-respawn-seconds=复活等待时间（秒）
airi-companion-perception-radius=感知半径
airi-companion-follow-distance=跟随距离

[mod-setting-description]
airi-companion-bridge-port=AIRI AgentBridge 在本机监听的 UDP 端口。
airi-companion-session-token=用于拒绝无关本地 UDP 数据包的可选共享令牌；留空则不校验。
airi-companion-auto-spawn=存档载入后，在第一名可用玩家附近创建 AIRI。
airi-companion-display-name=显示在陪玩角色头顶和同阵营地图标记上的名称。
airi-companion-respawn-seconds=AIRI 死亡后等待多久重新出现。
airi-companion-perception-radius=结构化观察工具最多能读取的半径。
airi-companion-follow-distance=AIRI 跟随主人时尝试保持的距离。

[gui]
airi-title=AIRI
airi-chat=聊天
airi-panel-title=AIRI 陪玩
airi-toggle-tooltip=打开或关闭陪玩聊天窗口（默认快捷键 G，可在控制设置中修改）
airi-close=关闭聊天窗口
airi-status-prefix=状态：
airi-body-present=角色正常
airi-body-absent=角色未生成
airi-bridge-connected=Agent 桥已连接
airi-bridge-disconnected=Agent 桥未连接
airi-no-plan=当前没有任务计划。
airi-ready=AIRI 已经准备好了。
airi-chat-empty=还没有聊天记录。和团子说句话吧。
airi-message-user=主人
airi-message-system=系统
airi-chat-ready=可以发送消息
airi-chat-offline=Agent 桥未连接，暂时不能发送消息
airi-processing=团子正在处理这一步[__1__]  已等待 __2__ 秒
airi-processing-disconnected=仍在等待结果，但 Agent 桥已断开[__1__]  已等待 __2__ 秒
airi-input-tooltip=输入消息，按 Enter 发送
airi-shortcut-hint=G：打开/关闭聊天（可改键）
airi-message-too-long=消息太长了，最多允许 __1__ 个 UTF-8 字节。
airi-wait-current=团子仍在处理上一条消息，请等结果返回后再发送。
airi-send=发送
airi-spawn=召唤
airi-follow=跟随
airi-stop=停止
airi-task-accepted=任务已接受
airi-command-complete=命令已完成
airi-command-failed=命令失败
airi-bridge-unavailable=本地 AgentBridge 不可用。请用 --enable-lua-udp 启动 Factorio，并运行桥接进程。
airi-turn-cancelled=已请求停止当前模型任务；迟到的回复和后续动作会被忽略。
airi-turn-cancelled-offline=游戏动作已停止；AgentBridge 当前不可用，本轮已在界面取消。

[controls]
airi-companion-toggle-chat=打开/关闭 AIRI 聊天窗口

[command-help]
airi=打开 AIRI，或使用：/airi spawn|follow|stop|status|observe [半径]|find 资源 [半径]|move x y|mine 资源 数量|craft 配方 数量
